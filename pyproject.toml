[project]
name = "hedy"
version = "0.1.0"
description = "A small GPT built from scratch for studying LLMs"
requires-python = ">=3.10"
dependencies = ["torch>=2.3", "numpy"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hedy"]
